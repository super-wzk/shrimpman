[package]
name = "shrimpman-mhf-launcher"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
bumpalo = "3.20.3"
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
egui.workspace = true
eframe = { version = "0.36.1", default-features = false, features = ["wgpu"] }
ehttp = { version = "0.7.1", features = ["json"] }
jiff = { version = "0.2", features = ["serde"] }
mhf-overlay = { path = "../overlay" }
minhook.workspace = true
serde = { version = "1", features = ["derive"] }
shrimpman-common = { path = "../../../shrimpman/crates/common" }
shrimpman-domain = { path = "../../../shrimpman/crates/domain" }
toml = "1"
unicode-width = { version = "0.2", features = ["cjk"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
