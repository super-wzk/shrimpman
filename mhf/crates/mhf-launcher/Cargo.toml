[package]
name = "shrimpman-mhf-launcher"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
bumpalo = "3.20.3"
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
egui.workspace = true
egui-hunter = { path = "../egui-hunter" }
eframe = { version = "0.36.1", default-features = false, features = ["wgpu"] }
jiff = { version = "0.2", features = ["serde"] }
mhf-hooks = { path = "../hooks" }
mhf-overlay = { path = "../overlay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shrimpman-common = { path = "../../../shrimpman/crates/common" }
shrimpman-domain = { path = "../../../shrimpman/crates/domain" }
toml = "1"
unicode-width = { version = "0.2", features = ["cjk"] }
unicode-segmentation = "1.13.3"
ureq = "3.4"
windows = { workspace = true, features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D9",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
