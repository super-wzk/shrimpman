[package]
name = "mhf-launcher"
version.workspace = true
edition.workspace = true
publish = false
default-run = "mhf-launcher"

[features]
default = ["login", "translation"]
login = [
    "dep:binrw",
    "dep:bytes",
    "dep:config",
    "dep:eframe",
    "dep:encoding_rs",
    "dep:futures-util",
    "dep:jiff",
    "dep:shrimpman-common",
    "dep:shrimpman-domain",
    "dep:shrimpman-transport",
    "dep:tokio",
    "dep:ureq",
    "windows/Win32_Security_Credentials",
]
offline = []
debug = ["offline"]
unicode = [
    "dep:bumpalo",
    "dep:unicode-segmentation",
    "dep:unicode-width",
]
translation = ["unicode"]

[[bin]]
name = "mhf-launcher"
path = "src/bin/mhf-launcher/main.rs"
required-features = ["login"]

[[bin]]
name = "mhf-debug-launcher"
path = "src/bin/mhf-debug-launcher/main.rs"
required-features = ["offline"]

[dependencies]
binrw = { version = "0.15", optional = true }
bumpalo = { version = "3.20.3", optional = true }
bytes = { version = "1", optional = true }
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml"], optional = true }
eframe = { version = "0.36.1", default-features = false, features = ["wgpu"], optional = true }
egui-hunter = { path = "../egui-hunter" }
egui.workspace = true
encoding_rs = { version = "0.8", optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
jiff = { version = "0.2", features = ["serde"], optional = true }
mhf-geometry = { path = "../geometry" }
mhf-hooks = { path = "../hooks" }
mhf-overlay = { path = "../overlay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shrimpman-common = { path = "../../../shrimpman/crates/common", optional = true }
shrimpman-domain = { path = "../../../shrimpman/crates/domain", optional = true }
shrimpman-transport = { path = "../../../shrimpman/crates/transport", optional = true }
tokio = { version = "1", features = ["net", "rt", "time"], optional = true }
toml = "1"
unicode-segmentation = { version = "1.13.3", optional = true }
unicode-width = { version = "0.2", features = ["cjk"], optional = true }
ureq = { version = "3.4", optional = true }
windows = { workspace = true, features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D9",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
