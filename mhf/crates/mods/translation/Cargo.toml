[package]
name = "mhf-translation"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
headers = ["safer-ffi/headers", "mhf-mod-sdk/headers"]
provider = ["dep:mhf-config", "dep:mhf-mod-host", "dep:toml"]

[dependencies]
mhf-mod-sdk = { path = "../../runtime/mod-sdk" }
mhf-config = { path = "../config", optional = true }
mhf-mod-host = { path = "../../runtime/mod-host", optional = true }
safer-ffi = { workspace = true, features = ["dyn-traits"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
