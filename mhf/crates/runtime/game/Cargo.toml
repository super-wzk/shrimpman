[package]
name = "mhf-game"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
mhf-mod-api = { path = "../mod-api" }
mhf-mod-host = { path = "../mod-host" }
mhf-mod-package = { path = "../mod-package" }
toml = "1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }
