[package]
name = "shrimpman-discovery"
version.workspace = true
edition.workspace = true

[dependencies]
etcd-client = "0.19"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
