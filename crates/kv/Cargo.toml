[package]
name = "shrimpman-kv"
version.workspace = true
edition.workspace = true

[dependencies]
etcd-client = "0.19"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
