name: "shrimpman"

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces:cached
    environment:
      SHRIMPMAN_ENTRANCE__LEASE_KV__ENDPOINTS: http://etcd:2379
      SHRIMPMAN_SIGN__LEASE_KV__ENDPOINTS: http://etcd:2379

  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.14
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd-data:/etcd-data

volumes:
  etcd-data:
