[package]
name = "shrimpman-world"
version.workspace = true
edition.workspace = true

[dependencies]
binrw = "0.15"
bytes = "1"
config = { version = "0.15", default-features = false, features = ["toml"] }
futures-util = { version = "0.3", features = ["sink"] }
inventory = "0.3"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
shrimpman-common = { path = "../common" }
shrimpman-discovery = { path = "../discovery" }
shrimpman-domain = { path = "../domain" }
shrimpman-lease-kv = { path = "../lease-kv" }
shrimpman-persistence = { path = "../persistence" }
shrimpman-protocol = { path = "../protocol" }
shrimpman-runtime = { path = "../runtime" }
shrimpman-transport = { path = "../transport" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toasty = { version = "0.10", features = ["sqlite"] }
tracing = "0.1"
